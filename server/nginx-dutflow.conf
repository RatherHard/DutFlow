# Example only: replace domain and certificate paths before installing.
# The backend must listen on loopback; expose only HTTPS through nginx.
server {
    listen 443 ssl;
    server_name rendezvous.example.com;
    ssl_certificate /etc/letsencrypt/live/rendezvous.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rendezvous.example.com/privkey.pem;
    location /v1/ { proxy_pass http://127.0.0.1:18787; }
    location = /healthz { proxy_pass http://127.0.0.1:18787/healthz; }
}
